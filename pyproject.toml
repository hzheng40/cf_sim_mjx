[project]
name = "crazyflie-mjx-sim"
version = "0.1.0"
description = "Minimal MJX Crazyflie simulation environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chex>=0.1.91",
    "flax>=0.12.0",
    "jax>=0.8.0",
    "mujoco>=3.3.7",
    "mujoco-mjx>=3.3.7",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
cuda13 = ["jax[cuda13]>=0.8.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
